<title>Our Monthsary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* Layout: one screen. A toy Metro Manila-to-Tagaytay map filling the frame, place buttons underneath. */
  :root {
    color-scheme: dark;
    --night: #170a11;
    --wine-glass: rgba(43, 14, 27, 0.74);
    --rose: #ee5b78;
    --blush: #f7c6cf;
    --gold: #f1c58f;
    --ink: #fcf0f2;
    --muted: #c9a2ad;
    --line: rgba(247, 198, 207, 0.22);

    --display: "Gloock", "Didot", "Bodoni 72", Georgia, serif;
    --body: "Newsreader", "Iowan Old Style", Georgia, serif;
  }

  html, body { height: 100%; }
  html { background: var(--night); }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
    overflow: hidden;
  }

  .app {
    height: 100%;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    gap: 0.9rem;
    padding-inline: 16px;
    padding-block: 14px;
    max-width: 1280px;
    margin: 0 auto;
  }

  button {
    font: inherit;
    color: var(--ink);
    background: var(--wine-glass);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.5rem 1rem;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }
  button:hover { background: rgba(80, 26, 48, 0.85); border-color: var(--blush); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .map-stage {
    position: relative;
    min-height: 0;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, #ffd9a6 0%, #f7b48c 45%, #d98f86 100%);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  }
  .map-stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #aab3bc 0%, #8d97a1 50%, #6f7882 100%);
    opacity: 0;
    transition: opacity 2s ease;
  }
  .map-stage.rainy::before { opacity: 1; }
  #mapCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #mapCanvas:active { cursor: grabbing; }
  .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .street-label, .region-label {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    color: #fffaf2;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75), 0 0 8px rgba(0, 0, 0, 0.35);
  }
  .street-label {
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .region-label {
    font-family: var(--display);
    font-size: 1.15rem;
    letter-spacing: 0.04em;
  }
  .pin-label {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: auto;
    transform: translate(-50%, -100%);
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.28rem 0.65rem;
    white-space: nowrap;
    background: rgba(43, 14, 27, 0.82);
  }
  .pin-label:active { transform: translate(-50%, -100%) scale(0.96); }
  .pin-label.active, .place-list button.active { background: var(--rose); border-color: transparent; color: #fff; }
  .map-tools {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.5rem;
  }
  .map-tools button { font-size: 0.85rem; padding: 0.4rem 0.85rem; }
  .map-tools button[aria-pressed="true"] { border-color: var(--blush); }
  #rainBtn[aria-pressed="true"] { background: #3d5a80; border-color: #a9c6ea; }
  #lofiBtn[aria-pressed="true"] { background: rgba(238, 91, 120, 0.85); border-color: var(--blush); }
  .map-card {
    position: absolute;
    left: 12px;
    bottom: 12px;
    max-width: min(340px, calc(100% - 24px));
    box-sizing: border-box;
    padding: 0.85rem 1rem;
    border-radius: 14px;
    background: rgba(36, 12, 23, 0.86);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    display: grid;
    gap: 0.15rem;
  }
  .map-card p { margin: 0; }
  .map-kicker {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .map-title { font-family: var(--display); font-size: 1.45rem; line-height: 1.15; }
  .map-note { color: var(--muted); font-style: italic; font-size: 0.98rem; line-height: 1.4; }
  .place-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
  .place-list button { font-size: 0.92rem; }

  @media (max-width: 560px) {
    .app { gap: 0.7rem; padding-block: 10px; }
    .map-tools { top: 10px; right: 10px; left: 10px; }
    .map-tools button { font-size: 0.76rem; padding: 0.32rem 0.65rem; }
    .map-title { font-size: 1.2rem; }
    .map-note { font-size: 0.9rem; }
    .pin-label { font-size: 0.72rem; padding: 0.22rem 0.5rem; }
    .street-label { font-size: 0.58rem; }
    .region-label { font-size: 0.95rem; }
    .place-list { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .place-list button { flex: none; font-size: 0.86rem; }
  }
</style>

<div class="app">
  <div class="map-stage" id="mapStage">

</div>

  });
  function inLoop(n) { return !!LOOP[n]; }
  addNpc(makeBus(0xf2f2f2, 0x1f5fbf, 'TAGAYTAY'), 'hwy', N.MK, N.J, 0.6, inLoop);
  addNpc(makeBus(0xffd400, 0xc8102e, 'NASUGBU'), 'hwy', N.R3, N.B, 0.6, inLoop);
  [[0xf2f2f2, N.D, N.A3], [0x2a2a2a, N.J, N.S1], [0x9a1f2e, N.MO, N.R3], [0x4f6f8f, N.T1, N.T2]].forEach(function (c) {
    addNpc(makeSedan(c[0]), 'hwy', c[1], c[2], 0.65 + Math.random() * 0.1, inLoop);

  function updateNpcs(dt) {

  // ---------- lights: a late-afternoon sun over Manila Bay that follows the view

    var wobble = Math.sin(t * 2.2) * 7;   // slow tape drift, in cents
    [['sine', 1, 1], ['triangle', 2, 0.18]].forEach(function (v) {
      var o = ctx.createOscillator(); o.type = v[0]; o.frequency.value = hz(n) * v[1]; o.detune.value = wobble;
      var og = ctx.createGain(); og.gain.value = v[2];
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  function kick(t) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    g.gain.setValueAtTime(0.55, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + 0.45);
  }
  function noise(t, type, freq, vol, dur) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    var g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.02);
  }
  function schedule() {
    while (nextT < ctx.currentTime + 1.2) {
      var s = step % 16, bar = Math.floor(step / 16) % 4, cycle = Math.floor(step / 64);
      var t = nextT + (s % 2 ? STEP * 0.2 : 0);   // lazy swing on the off-beats
      if (s === 0) {
        CHORDS[bar].forEach(function (n, q) { keys(n + 12, t + q * 0.012, STEP * 15, 0.045); });
        keys(BASS[bar], t, STEP * 7, 0.16);
      }
      if (s === 8) keys(BASS[bar] + (bar % 2 ? 7 : 12), t, STEP * 6, 0.11);
      if (s === 10) { keys(CHORDS[bar][2] + 12, t, STEP * 5, 0.03); keys(CHORDS[bar][3] + 12, t, STEP * 5, 0.03); }
      if (cycle % 2 === 1) MELODY.forEach(function (m) { if (m[0] === bar && m[1] === s) keys(m[2], t, STEP * m[3] * 1.4, 0.05); });
      if (s === 0 || s === 10) kick(t);
      if (s === 4 || s === 12) noise(t, 'bandpass', 1800, 0.22, 0.2);
      if (s % 2 === 0) noise(t, 'highpass', 7500, s % 4 === 0 ? 0.05 : 0.03, 0.05);
      step++; nextT += STEP;
    }
  }
  btn.addEventListener('click', function () {
    if (!ctx) init();
    if (ctx.state === 'suspended') ctx.resume();
    playing = !playing;
    btn.setAttribute('aria-pressed', String(playing));
    btn.textContent = playing ? 'Pause lofi' : 'Play lofi';
    var now = ctx.currentTime;
    out.gain.cancelScheduledValues(now);
    out.gain.setValueAtTime(out.gain.value, now);
    if (playing) {
      nextT = Math.max(nextT, now + 0.05);
      out.gain.linearRampToValueAtTime(0.9, now + 1.5);
      schedule();
      timer = setInterval(schedule, 100);
    } else {
      out.gain.linearRampToValueAtTime(0, now + 0.6);
      clearInterval(timer); timer = null;
    }
  });
})();
</script>
